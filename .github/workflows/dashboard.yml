name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - "packages/dashboard/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/dashboard/**"

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/dashboard

      - name: Type check
        run: npm run type-check
        working-directory: packages/dashboard

      - name: Lint
        run: npm run lint
        working-directory: packages/dashboard

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/dashboard

      - name: Run unit tests
        run: npm run test:unit -- --coverage
        working-directory: packages/dashboard

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: packages/dashboard/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/dashboard

      - name: Build
        run: npm run build
        working-directory: packages/dashboard
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: packages/dashboard/.next
          retention-days: 7

  rust-backend:
    name: Rust Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --package oms-engine
        working-directory: packages

      - name: Run Rust tests
        run: cargo test --package oms-engine
        working-directory: packages
