events {
    worker_connections 1024;
}

http {
    # Upstream services
    upstream overstory {
        server overstory:3000;
    }

    upstream clawteam {
        server clawteam:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream questdb {
        server questdb:9000;
    }

    # Main dashboard server
    server {
        listen 80;
        server_name localhost;

        # Root dashboard - Overstory Swarm Monitor
        location / {
            proxy_pass http://overstory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ClawTeam Kanban Board
        location /kanban/ {
            proxy_pass http://clawteam/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana Dashboards
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
        }

        # QuestDB Console
        location /questdb/ {
            proxy_pass http://questdb/;
            proxy_set_header Host $host;
        }

        # API endpoints
        location /api/overstory/ {
            proxy_pass http://overstory/api/;
            proxy_set_header Host $host;
        }

        location /api/clawteam/ {
            proxy_pass http://clawteam/api/;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            return 200 "Dashboard Proxy OK\n";
            add_header Content-Type text/plain;
        }
    }
}
