version: '3.8'

# Extended Docker Compose for Sentinel-Nexus Dashboard & Monitoring Systems
# This adds the UI layer and continuous evaluation systems

services:
  # ============================================
  # DASHBOARD & ORCHESTRATION LAYER
  # ============================================

  # Overstory - Self-Evolving Swarm Dashboard
  overstory:
    build:
      context: ./packages/overstory
      dockerfile: Dockerfile
    container_name: sentinel-overstory
    ports:
      - "3000:3000"    # Main dashboard
      - "3001:3001"    # API port
    depends_on:
      - redis
      - questdb
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - OV_LOG_LEVEL=info
      - OV_WATCHDOG_INTERVAL=30000
    volumes:
      - ./packages/overstory:/app
      - overstory_data:/app/data
    command: >
      sh -c "
        bun run build &&
        ov coordinator start &&
        ov watch --background &&
        ov dashboard --port 3000
      "
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - dashboard

  # ClawTeam - AI Hedge Fund Swarm Kanban UI
  clawteam:
    build:
      context: ./packages/clawteam
      dockerfile: Dockerfile
    container_name: sentinel-clawteam
    ports:
      - "8080:8080"    # Kanban board
    depends_on:
      - redis
      - postgres
    environment:
      - CLAWTEAM_MODE=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://traderx:traderx_secret@postgres:5432/agenttrade
      - DEFAULT_TEAM_SIZE=7
      - AUTO_LAUNCH_TEAMS=true
    volumes:
      - ./packages/clawteam:/app
      - clawteam_teams:/app/teams
    command: >
      sh -c "
        clawteam launch hedge-fund --team fund1 --goal 'Deploy live crypto strategies' --auto &&
        clawteam board serve --port 8080 --host 0.0.0.0
      "
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - dashboard

  # ============================================
  # EVALUATION & SAFETY LAYER
  # ============================================

  # Mandoline MCP Server - Continuous Evaluation
  mandoline-mcp:
    build:
      context: ./packages/mandoline-mcp
      dockerfile: Dockerfile
    container_name: sentinel-mandoline
    ports:
      - "8081:8080"    # MCP server port
    depends_on:
      - redis
      - questdb
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LOG_LEVEL=info
      - EVALUATION_MODE=continuous
      - SAFETY_THRESHOLD=0.85
      - REDIS_URL=redis://redis:6379
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
    volumes:
      - ./packages/mandoline-mcp:/app
      - mandoline_evaluations:/app/evaluations
    command: npm start
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - evaluation

  # ============================================
  # UNIFIED DASHBOARD PROXY
  # ============================================

  # Nginx - Unified Dashboard Access
  dashboard-proxy:
    image: nginx:alpine
    container_name: sentinel-dashboard-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/dashboard-nginx.conf:/etc/nginx/nginx.conf
      - ./config/ssl:/etc/nginx/ssl
    depends_on:
      - overstory
      - clawteam
      - grafana
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - dashboard

# ============================================
# EXTENDED VOLUMES
# ============================================
volumes:
  overstory_data:
    driver: local
  clawteam_teams:
    driver: local
  mandoline_evaluations:
    driver: local

# ============================================
# NETWORKS (extends from main compose)
# ============================================
networks:
  sentinel-network:
    external: true  # Use the network from docker-compose.sentinel.yml
