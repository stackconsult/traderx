---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: oms-engine
  namespace: traderx

resources:
- namespace.yaml
- serviceaccount.yaml
- rbac.yaml
- configmap.yaml
- pvc.yaml
- priorityclass.yaml
- deployment.yaml
- service.yaml
- pdb.yaml
- hpa.yaml
- servicemonitor.yaml
- networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: oms-engine
  app.kubernetes.io/component: trading
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: traderx

commonAnnotations:
  config.kubernetes.io/origin: traderx-platform


vars:
- name: OMS_NAMESPACE
  objref:
    kind: Namespace
    name: traderx
    apiVersion: v1
  fieldref:
    fieldpath: metadata.name

replicas:
- name: oms-engine
  count: 3

images:
- name: traderx/oms-engine
  newTag: latest

namespace: traderx
