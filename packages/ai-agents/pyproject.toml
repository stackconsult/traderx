[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traderx-ai-agents"
version = "0.1.0"
description = "AI agents for TraderX Sentinel-Nexus architecture"
authors = [
    {name = "TraderX Team", email = "dev@traderx.com"},
]
dependencies = [
    "asyncio",
    "aiohttp",
    "pandas",
    "numpy",
    "pydantic",
    "python-dotenv",
    "langgraph>=0.0.40",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "redis>=5.0.0",
    "websockets",
    "yfinance>=0.2.18",
    "TA-Lib>=0.4.25",
    "textblob>=0.17.1",
    "pytest",
    "pytest-asyncio",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traderx_ai_agents"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
