[package]
name = "traderx-ebpf-router"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { version = "0.11", features = ["async_tokio"] }
aya-log = "0.2"
aya-ebpf = "0.1"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
redis = { version = "0.23", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
network-byte-order = "0.4"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# DPDK for ultra-low latency kernel bypass
dpdk-sys = { git = "https://github.com/datenlord/dpdk-sys", optional = true }
rust-dpdk = { git = "https://github.com/flier/rust-dpdk", optional = true }

[features]
default = []
dpdk = ["dpdk-sys", "rust-dpdk"]

[[bin]]
name = "traderx-ebpf-router"
path = "src/main.rs"
