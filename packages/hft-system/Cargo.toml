# This is a virtual manifest for the HFT system
# See ../../Cargo.toml for workspace configuration

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "High-Frequency Trading System"

[workspace.dependencies]
# Internal workspace crates
common = { path = "crates/common" }
feed_handler = { path = "crates/feed_handler" }
strategy = { path = "crates/strategy" }
execution = { path = "crates/execution" }
risk_engine = { path = "crates/risk_engine" }
telemetry = { path = "crates/telemetry" }

# External dependencies
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
