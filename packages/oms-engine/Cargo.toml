[package]
name = "oms-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["core"]
core = []
hft = []
ai = []
backtest = ["core", "hft"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Shared mem0 types
traderx-mem0-types = { workspace = true }

# Specific dependencies
rust_decimal = { version = "1.33", features = ["serde"] }
dashmap = "5.5"
async-trait = "0.1"
redis = { version = "0.23", features = ["tokio-comp"] }
byteorder = "1.5"
aeron-rs = "0.1.8"  # Ultra-low latency messaging
# Security fix: RUSTSEC-2024-0437 - Force protobuf >= 3.7.2
protobuf = ">=3.7.2"
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["limit", "util"] }
tower-http = { version = "0.5", features = ["trace", "limit", "cors", "compression-br"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
prometheus = { workspace = true, features = ["process"] }
lazy_static = { workspace = true }
tracing-subscriber = { workspace = true }
# HTTP client for exchange adapters - Security fix: RUSTSEC-2026-0104, RUSTSEC-2026-0098, RUSTSEC-2026-0099
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bench]]
name = "risk_bus_benchmark"
harness = false
